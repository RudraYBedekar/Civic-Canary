[project]
name = "civic-canary"
version = "0.1.0"
description = "A Strands agent that detects changes in public-benefit portals and drafts safe playbook updates."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "bedrock-agentcore>=1.0.0",
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "mangum>=0.19.0",
  "playwright>=1.55.0",
  "pydantic>=2.11.0",
  "strands-agents>=1.0.0",
  "uvicorn>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0"
]
infra = [
  "aws-cdk-lib>=2.267.0",
  "constructs>=10.4.0"
]

[project.scripts]
civic-canary = "agent.civic_canary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "cdk.out", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
